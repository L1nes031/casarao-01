<!DOCTYPE html>
<htmt>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Loja RaLuli</title>
        <link href="../css/style.css" rel="stylesheet">
   </head>
   <body>
        <header>
            <h1>LOJA RALULI</h1>
                <P>Compre com qualidade</P>
            <nav>
                <a href="../pages/inicio.html"> inicio</a>
                <a href="../pages/produtos.html"> produtos</a>
                <a href="../pages/galeria.html"> galeria</a>
                <a href="carrinho"> carrinho</a>
                <a href="../pages/cadastro.html"> cadastro</a>
            </nav>
        </header>
        <main>
            <section>
                    <h2>Cadastro</h2>

                <form>

                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

                    <br><br>

                    <label for="gmail">Gmail:</label>
                    <input type="email" id="gmail" name="gmail" placeholder="Digite seu Gmail">

                    <br><br>

                    <button type="submit">
                        Cadastrar
                    </button>

                </form>
                    <div class="cadastro">

                        <section>
                    <h2>Entre em Contato</h2>

                    <form>

                        <!-- Nome -->
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome">

                        <br><br>

                        <!-- E-mail -->
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email">

                        <br><br>

                        <!-- Senha -->
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha">

                        <br><br>

                        <!-- Número -->
                        <label for="numero">Número do pedido:</label>
                        <input type="number" id="numero" name="numero">

                        <br><br>

                        <!-- Data -->
                        <label for="data">Data de nascimento:</label>
                        <input type="date" id="data" name="data">

                        <br><br>

                        <!-- Radio -->
                        <p>Tipo de atendimento:</p>

                        <input type="radio" id="duvida" name="atendimento" value="duvida">
                        <label for="duvida">Dúvida</label>

                        <input type="radio" id="pedido" name="atendimento" value="pedido">
                        <label for="pedido">Pedido</label>

                        <input type="radio" id="troca" name="atendimento" value="troca">
                        <label for="troca">Troca</label>

                        <br><br>

                        <!-- Checkbox -->
                        <input type="checkbox" id="novidades" name="novidades">
                        <label for="novidades">Quero receber novidades da loja</label>

                        <br><br>

                        <!-- Select -->
                        <label for="categoria">Categoria de interesse:</label>

                        <select id="categoria" name="categoria">
                            <option>Camisas</option>
                            <option>Calças</option>
                            <option>Vestidos</option>
                        </select>

                        <br><br>

                        <!-- Área de texto -->
                        <label for="mensagem">Mensagem:</label>
                        <br>

                        <textarea id="mensagem" name="mensagem" rows="5" cols="40"></textarea>

                        <br><br>

                        <!-- Botão -->
                        <button type="submit">
                            Enviar
                        </button>
                    
                    </form>
                </section>

                <footer>
                    <p> 2026 Loja de Roupas - Todos os direitos reservados.</p>
                </footer>

                    </div>
                    </section>
                </section>
